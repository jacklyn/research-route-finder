/* =====================================================================
   4. RULES
   Evaluated top to bottom. The first route whose conditions match wins.
   - existing: ALL conditions must match
   - partner, gutCheck: ANY condition matches
   - diy: the default when nothing above matched
   Each condition's `reason` appears under "Why you got this result".
   ===================================================================== */
const RULES = {
  existing: {
    match: "all",
    conditions: [
      { test: a => a.evidence === "yes", reason: "You already have evidence that may answer this." },
      { test: a => a.risk !== "high", reason: "The decision is contained or reversible, so existing evidence can carry it." },
    ],
  },
  partner: {
    match: "any",
    conditions: [
      { test: a => a.risk === "high", reason: "It’s a big bet. When getting it wrong is expensive, the evidence has to hold up." },
      { test: a => a.need === "organizational", reason: "Other people will use this evidence to make a larger decision, so it needs to stand up to scrutiny." },
      { test: a => a.recruiting === "hard", reason: "The right participants are hard to reach. Research can help with screening and access." },
      { test: a => a.goal === "problem" && a.audience === "new", reason: "You’re trying to understand the problem for an audience we don’t know well. That’s foundational work." },
      { test: a => a.audience === "new" && a.risk === "medium", reason: "A new audience plus a meaningful decision adds up to more uncertainty than a lightweight study handles well." },
    ],
  },
  gutCheck: {
    match: "any",
    conditions: [
      { test: a => a.need === "unclear", reason: "The research question is still fuzzy. Sharpen it with Research before choosing a method." },
      { test: a => a.goal === "problem", reason: "Problem research is easy to aim at the wrong question. A quick conversation helps you frame it." },

      { test: a => a.audience === "some", reason: "There are gaps in what we know about these users." },

      { test: a => a.recruiting === "some", reason: "Finding the right participants takes some screening." },
    ],
  },
  diy: {
    match: "default",
    conditions: [
      { test: a => a.risk === "low", reason: "The decision is contained, so a lightweight study is the right size." },
      { test: a => a.audience === "known", reason: "You know this audience well." },
      { test: a => a.recruiting === "easy", reason: "You can reach the right people through normal channels." },

/* =====================================================================
   6. DECISION ENGINE
   ===================================================================== */
function evaluate(answers, evidenceCheck) {
  const ctx = [];
  if (evidenceCheck === "startThere") {
    return { route: "existing", reasons: [CONTEXT_REASONS.startThere], method: null };
  }
  if (evidenceCheck === "checked") ctx.push(CONTEXT_REASONS.checked);

  for (const route of ["existing", "partner", "gutCheck"]) {
    const rule = RULES[route];
    const matched = rule.conditions.filter(c => c.test(answers));
    const hit = rule.match === "all" ? matched.length === rule.conditions.length : matched.length > 0;
    if (hit) {
      return { route, reasons: [...matched.map(c => c.reason), ...ctx], method: ROUTES[route].showsMethod ? METHODS[answers.goal] : null };
    }
  }
  const supporting = RULES.diy.conditions.filter(c => c.test(answers)).map(c => c.reason);
  return { route: "diy", reasons: [...supporting, ...ctx], method: METHODS[answers.goal] };
}

// "How to run it" and sample questions appear on routes the designer runs themselves.
function showsHowToRun(result) {
  return result.route === "diy" || result.route === "gutCheck";
}

function watchOutFor(result, answers) {
  const route = ROUTES[result.route];
  const items = [];
  if (result.method) items.push(result.method.watchOut);
  const run = showsHowToRun(result) ? HOW_TO_RUN[answers.goal] : null;
  if (run && run.watchOut) items.push(run.watchOut);
  if (result.route === "gutCheck" && answers.need === "unclear") {
    items.push("Pin down the question before picking a method. A sharp question makes even a small study useful.");
  }
  return [...items, ...route.watchOut];
}

function Question({ question, index, total, value, returning, onChange, onBack, onNext }) {
  const headRef = useRef(null);
  useEffect(() => { headRef.current && headRef.current.focus({ preventScroll: true }); }, [question.id]);

  // Letter keys select an answer (A, B, C…)
  useEffect(() => {
    const onKey = e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "textarea" || (tag === "input" && e.target.type === "text")) return;
      const i = e.key.toUpperCase().charCodeAt(0) - 65;
      if (e.key.length === 1 && i >= 0 && i < question.options.length) {
        onChange(question.options[i].value);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [question, onChange]);

  const submit = e => { e.preventDefault(); if (value) onNext(); };

  return html`
    <form className="question" onSubmit=${submit} noValidate>
      <${Progress} current=${index + 1} total=${total} />
      <div className="question__head">
        <h2 className="headline" ref=${headRef} tabIndex="-1" id=${"q-" + question.id}>${question.headline}</h2>
        ${question.support && html`<p className="support">${question.support}</p>`}
      </div>
      <fieldset className="answers" aria-labelledby=${"q-" + question.id}>
        ${question.options.map((opt, i) => html`
          <${AnswerCard} key=${opt.value} name=${question.id} option=${opt}
            letter=${String.fromCharCode(65 + i)} checked=${value === opt.value} onSelect=${onChange} />`)}
      </fieldset>
      <div className="navrow">
        <${Button} variant="ghost" onClick=${onBack}><${Arrow} back /> ${returning ? "Back to my result" : "Back"}</${Button}>
        <span className="navrow__hint">Press ${String.fromCharCode(65)}–${String.fromCharCode(64 + question.options.length)} to choose, Enter to continue</span>
        <button type="submit" className="btn btn--primary" disabled=${!value}>
          ${returning ? "Update my result" : index + 1 === total ? "See my result" : "Continue"} <${Arrow} />
        </button>
      </div>
    </form>`;
}

function buildSummary({ topic, answers, result, evidenceCheck }) {
  const route = ROUTES[result.route];
  const run = showsHowToRun(result) ? HOW_TO_RUN[answers.goal] : null;
  const lines = [];
  lines.push(`Research route: ${route.scaleLabel}`);
  if (topic) lines.push(`Question: ${topic}`);
  lines.push("");
  if (result.method) lines.push(`Method: ${result.method.name}`);
  else lines.push(`Approach: ${route.approach.name}`);
  if (run) lines.push(`How to run it: ${run.methodName} (${run.tool})`);
  const people = run && run.participants ? run.participants : (result.method && result.method.participants);
  if (people && result.route !== "partner") lines.push(`Starting point: ${people}`);
  lines.push("");
  lines.push("My answers:");
  QUESTIONS.forEach(q => {
    const opt = q.options.find(o => o.value === answers[q.id]);
    let a = opt ? opt.title : "—";
    if (q.id === "evidence" && evidenceCheck === "checked") a += " (checked, still need research)";
    if (q.id === "evidence" && evidenceCheck === "startThere") a += " (reviewing existing evidence first)";
    lines.push(`- ${q.short}: ${a}`);
  });
  lines.push("");
  lines.push("Why this route:");
  result.reasons.forEach(r => lines.push(`- ${r}`));
  if (route.bringResearch) {
    lines.push("");
    lines.push("For Research:");
    route.bringResearch.forEach(b => lines.push(`- ${b}: `));
  }
  return lines.join("\n");
}

function CopySummary({ text, variant = "secondary" }) {
  const [status, setStatus] = useState("idle"); // idle | copied | manual
  const areaRef = useRef(null);
  useEffect(() => {
    if (status === "manual" && areaRef.current) { areaRef.current.focus(); areaRef.current.select(); }
    if (status === "copied") { const t = setTimeout(() => setStatus("idle"), 4000); return () => clearTimeout(t); }
  }, [status]);
  const copy = () => {
    try {
      const p = navigator.clipboard && navigator.clipboard.writeText(text);
      if (!p) return setStatus("manual");
      p.then(() => setStatus("copied"), () => setStatus("manual"));
    } catch (e) { setStatus("manual"); }
  };
  return html`
    <div className="copy">
      <${Button} variant=${variant} onClick=${copy}>${status === "copied" ? "Copied" : "Copy summary"}</${Button}>
      <span className="copy__status" role="status" aria-live="polite">
        ${status === "copied" ? COPY_TEXT.copied : ""}
      </span>
      ${status === "manual" && html`
        <div className="copy__manual">
          <label htmlFor="summary-text" className="note">${COPY_TEXT.manual}</label>
          <textarea id="summary-text" ref=${areaRef} readOnly rows="10" value=${text}></textarea>
        </div>`}
    </div>`;
}

function Glance({ result, answers }) {
  const route = ROUTES[result.route];
  const run = showsHowToRun(result) ? HOW_TO_RUN[answers.goal] : null;
  const items = [{ k: "Route", v: route.scaleLabel }];
  items.push({ k: result.method ? route.methodLabel || "Method" : "Approach", v: result.method ? result.method.name : route.approach.name });
  if (run) items.push({ k: "Tool", v: run.tool });
  if (result.method && result.method.participants && result.route !== "partner") items.push({ k: "Starting point", v: result.method.participants });
  if (result.route === "partner" || result.route === "gutCheck") items.push({ k: "First step", v: result.route === "partner" ? "Reach out to Research" : "15–20 minutes with Research" });
  return html`
    <dl className="facts glance" aria-label="At a glance">
      ${items.map(i => html`<div key=${i.k}><dt>${i.k}</dt><dd>${i.v}</dd></div>`)}
    </dl>`;
}

function Trail({ answers, result, evidenceCheck, onClose, onEdit }) {
  return html`
    <section className="trail" aria-labelledby="trail-title">
      <div className="trail__head">
        <h3 id="trail-title">How we got here</h3>
        <${Button} variant="ghost" onClick=${onClose}>Hide</${Button}>
      </div>
      <ol className="trail__list">
        ${QUESTIONS.map((q, i) => {
          const opt = q.options.find(o => o.value === answers[q.id]);
          const f = FACTORS[q.id][answers[q.id]];
          let note = f.note;
          if (q.id === "evidence" && evidenceCheck === "checked") note = "You checked, and it didn’t answer the question.";
          if (q.id === "evidence" && evidenceCheck === "startThere") note = "You’re going to check existing evidence first.";
          const effect = q.id === "evidence" && evidenceCheck === "startThere" ? "lighter" : f.effect;
          return html`
            <li key=${q.id} className="trail__item">
              <div>
                <p className="trail__q">${q.short}</p>
                <p className="trail__a">${opt.title}</p>
              </div>
              <div className="trail__side">
                <span className=${"chip chip--" + effect}>${EFFECT_LABELS[effect]}</span>
                <button type="button" className="trail__edit" onClick=${() => onEdit(i)} aria-label=${`Change your answer to: ${q.headline}`}>Change</button>
              </div>
              <p className="trail__why">${note}</p>
            </li>`;
        })}
      </ol>
      <p className="note">Your route: <strong>${ROUTES[result.route].scaleLabel}</strong>. ${
        result.route === "existing" ? "Existing evidence comes first, as long as the decision isn’t a big bet."
        : result.route === "partner" ? "Any single high-stakes factor is enough for a partnership."
        : result.route === "gutCheck" ? "Nothing was high-stakes, but at least one factor added uncertainty worth a quick conversation."
        : "Nothing added enough uncertainty to need outside help."
      }</p>
    </section>`;
}

function Result({ topic, answers, evidenceCheck, onRestart, onEdit, initialTrail }) {
  const result = useMemo(() => evaluate(answers, evidenceCheck), [answers, evidenceCheck]);
  const route = ROUTES[result.route];
  const method = result.method;
  const watch = watchOutFor(result, answers);
  const run = showsHowToRun(result) ? HOW_TO_RUN[answers.goal] : null;
  const samples = showsHowToRun(result) ? SAMPLE_QUESTIONS[answers.goal] : null;
  // Participant count gets its own section only when "How to run it" doesn't already cover it.
  const participants = run && run.participants ? null : (route.participantsOverride || (method && method.participants));
  const summaryText = useMemo(() => buildSummary({ topic, answers, result, evidenceCheck }), [topic, answers, result, evidenceCheck]);
  const [showTrail, setShowTrail] = useState(!!initialTrail);
  const headRef = useRef(null);
  const trailRef = useRef(null);
  useEffect(() => { headRef.current && headRef.current.focus({ preventScroll: true }); }, []);
  useEffect(() => { if (showTrail && trailRef.current) trailRef.current.scrollIntoView({ behavior: initialTrail ? "auto" : "smooth", block: "start" }); }, [showTrail]);

  return html`
    <article className="result">
      <header className="reveal">
        ${topic && html`
          <div className="asked">
            <p className="asked__label">You’re trying to find out</p>
            <p className="asked__text">${topic}</p>
          </div>`}
        <p className="eyebrow">Your research route</p>
        <h2 className="headline-xl" ref=${headRef} tabIndex="-1">${route.headline}</h2>
        <p className="lede">${route.summary}</p>
        ${route.extra && html`<p className="reveal__extra">${route.extra}</p>`}
        <${RouteScale} active=${result.route} variant="result" />
        <${Glance} result=${result} answers=${answers} />
        <div className="reveal__actions">
          <${CopySummary} text=${summaryText} />
          <span className="note">${route.bringResearch ? COPY_TEXT.hintResearch : COPY_TEXT.hint}</span>
        </div>
      </header>

      <div className="sections">
        <${ResultSection} title="Recommended approach">
          ${route.showsMethod && method ? html`
            <div className="method">
              <p className="method__label">${route.methodLabel}</p>
              <p className="method__name">${method.name}</p>
            </div>
            <p>${method.description}</p>
            ${route.methodNote && html`<p className="note">${route.methodNote}</p>`}
            ${result.route === "gutCheck" && answers.goal === "problem" && html`<p className="note"><strong>Talk to Research before you start.</strong> Problem interviews are where a quick gut check pays off most.</p>`}
            ${result.route === "gutCheck" && answers.need === "unclear" && html`<p className="note"><strong>Treat this as a starting guess.</strong> Settle the research question with Research before you lock in a method.</p>`}
          ` : html`
            <p className="method__name">${route.approach.name}</p>
            <p>${route.approach.description}</p>
          `}
        </${ResultSection}>

        <${ResultSection} title="Why you got this result">
          <ul className="list">${result.reasons.map(r => html`<li key=${r}>${r}</li>`)}</ul>
        </${ResultSection}>

        <${ResultSection} title="What to do next">
          <ol className="list list--steps">${route.nextSteps.map(s => html`<li key=${s}>${s}</li>`)}</ol>
          ${route.bringResearch && html`
            <div className="bring">
              <p className="bring__title">Bring Research:</p>
              <ul className="list">${route.bringResearch.map(s => html`<li key=${s}>${s}</li>`)}</ul>
            </div>`}
          ${route.note && html`<p className="note">${route.note}</p>`}
          ${route.cta && html`<p className="cta-line">${route.cta}</p>`}
          ${showsHowToRun(result) && html`
            <div className="guides">
              ${GUIDE_LINKS.forDiy.map(key => html`
                <a key=${key} className="guide-link" href=${GUIDE_LINKS[key].href}>
                  <span className="guide-link__title">${GUIDE_LINKS[key].title}</span>
                  <span className="guide-link__desc">${GUIDE_LINKS[key].desc}</span>
                </a>`)}
            </div>`}
        </${ResultSection}>

        ${run && html`
          <${ResultSection} title="How to run it" collapsible teaser=${`${run.methodName} · ${run.tool}`}>
            <${HowToRun} run=${run} answers=${answers} route=${result.route} />
          </${ResultSection}>`}

        ${samples && html`
          <${ResultSection} title="Questions you could ask" collapsible teaser=${`${samples.try.length} to try, ${samples.avoid.length} to avoid`}>
            <${SampleQuestions} set=${samples} />
          </${ResultSection}>`}

        ${participants && html`
          <${ResultSection} title="Suggested participant count">
            <p className=${route.participantsOverride ? "" : "count"}>${participants}</p>
            ${!route.participantsOverride && html`<p className="note">That’s enough to spot the patterns that matter for this decision. It isn’t a statistically representative sample. ${QUANT_CAVEAT}</p>`}
          </${ResultSection}>`}

        ${watch.length > 0 && html`
          <${ResultSection} title="Watch out for">
            <ul className="list">${watch.map(w => html`<li key=${w}>${w}</li>`)}</ul>
          </${ResultSection}>`}
      </div>

      <aside className="callout">
        <span className="callout__mark" aria-hidden="true">“</span>
        <p>${FOOTER_CALLOUT}</p>
      </aside>

      <div className="result__actions">
        <${Button} onClick=${onRestart}>Start over</${Button}>
        <${Button} variant="secondary" onClick=${() => setShowTrail(s => !s)} aria-expanded=${showTrail} aria-controls="trail">
          ${showTrail ? "Hide how we got here" : "See how we got here"}
        </${Button}>
        <${CopySummary} text=${summaryText} variant="ghost" />
      </div>

      <div id="trail" ref=${trailRef}>
        ${showTrail && html`<${Trail} answers=${answers} result=${result} evidenceCheck=${evidenceCheck} onClose=${() => setShowTrail(false)} onEdit=${onEdit} />`}
      </div>
    </article>`;
}

/* =====================================================================
   8. APP (state machine: intro → questions → [evidence check] → result)
   ===================================================================== */
function App() {
  const [view, setView] = useState("intro");          // intro | question | evidenceCheck | result
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState({});
  const [topic, setTopic] = useState("");
  const [evidenceCheck, setEvidenceCheck] = useState(null); // null | "checked" | "startThere"
  const [returning, setReturning] = useState(false);  // true while changing one answer from the result
  const [reopenTrail, setReopenTrail] = useState(false); // reopen "How we got here" after an edit
  const [dir, setDir] = useState("fwd");
  const total = QUESTIONS.length;

  const go = (nextView, nextIndex, direction) => {
    setDir(direction);
    setView(nextView);
    if (nextIndex !== undefined) setIndex(nextIndex);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  };

  const select = value => {
    const q = QUESTIONS[index];
    setAnswers(prev => ({ ...prev, [q.id]: value }));
    if (q.id === "evidence" && value !== answers.evidence) setEvidenceCheck(null);
  };

  const finish = () => {
    if (answers.evidence === "maybe" && !evidenceCheck) return go("evidenceCheck", undefined, "fwd");
    go("result", undefined, "fwd");
  };
  const next = () => {
    if (returning) { setReturning(false); return finish(); }
    if (index < total - 1) return go("question", index + 1, "fwd");
    finish();
  };
  const back = () => {
    if (returning) { setReturning(false); return go("result", undefined, "back"); }
    index === 0 ? go("intro", 0, "back") : go("question", index - 1, "back");
  };
  const editFromResult = i => { setReturning(true); setReopenTrail(true); go("question", i, "back"); };
  const restart = () => { setAnswers({}); setTopic(""); setEvidenceCheck(null); setReturning(false); setReopenTrail(false); go("intro", 0, "back"); };

  const stageKey = view === "question" ? "q" + index : view;
  const q = QUESTIONS[index];

  return html`
    <div className="shell">
      <main key=${stageKey} className=${"stage stage--" + dir}>
        ${view === "intro" && html`<${Intro} topic=${topic} onTopic=${setTopic} onStart=${() => go("question", 0, "fwd")} />`}
        ${view === "question" && html`
          <${Question} question=${q} index=${index} total=${total} value=${answers[q.id]} returning=${returning}
            onChange=${select} onBack=${back} onNext=${next} />`}
        ${view === "evidenceCheck" && html`
          <${EvidenceCheck}
            onChecked=${() => { setEvidenceCheck("checked"); go("result", undefined, "fwd"); }}
            onStartThere=${() => { setEvidenceCheck("startThere"); go("result", undefined, "fwd"); }}
            onBack=${() => go("question", QUESTIONS.findIndex(x => x.id === "evidence"), "back")} />`}
        ${view === "result" && html`
          <${Result} topic=${topic.trim()} answers=${answers} evidenceCheck=${evidenceCheck}
            onRestart=${restart} onEdit=${editFromResult} initialTrail=${reopenTrail} />`}
      </main>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
